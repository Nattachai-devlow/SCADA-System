name: Deploy Schema Visualizer to Pages

# Deploy schema_visualizer.html เป็นหน้าเว็บจริงที่
# https://nattachai-devlow.github.io/SCADA-System/schema_visualizer.html
#
# workflow นี้ stage ไฟล์ไว้ 2 path คือ _site/index.html (กรณี Pages ใช้
# Source = GitHub Actions) และ _site/schema_visualizer.html ด้วย เพื่อให้ URL
# แบบระบุชื่อไฟล์ใช้ได้ทั้งตอนตั้ง Source เป็น GitHub Actions และ branch
# (ถ้าตั้งเป็น branch แล้วเปิด root เว็บไซต์จะได้ README แทน visualizer)
#
# หมายเหตุ: GitHub จะไม่ render ไฟล์ .html ในหน้า file browser ของ repo
# ไฟล์จะแสดงเป็น source code เสมอ (โดยเจตนา เพื่อไม่ให้ GitHub execute HTML
# ที่มาจาก repo) วิธีที่ได้หน้าเว็บจริงจึงต้อง deploy ผ่าน Pages นี้

on:
  push:
    branches: [master, main]
    paths:
      - "schema_visualizer.html"
      - ".github/workflows/pages.yml"
  # ให้กดรันเองได้จากหน้า Actions โดยไม่ต้องแก้ไฟล์ใด ๆ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ป้องกันไม่ให้ deploy ซ้อนกัน
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # ถ้ายังไม่เคยเปิด Pages มาก่อน ให้เปิดให้อัตโนมัติ
          # (ไม่ต้องไปกด Settings > Pages เอง)
          # ต้องมี permission pages: write ซึ่งประกาศไว้ด้านบนแล้ว
          enablement: true

      # visualizer เป็นไฟล์ HTML เดี่ยวจบ ไม่ต้อง build
      # จัดเตรียมเฉพาะไฟล์ที่ต้องการ ไม่เอา node_modules / .git ไปด้วย
      - name: Stage static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp schema_visualizer.html _site/schema_visualizer.html
          # ทำให้หน้าแรกของ Pages เปิดเป็น visualizer ทันที
          cp schema_visualizer.html _site/index.html
          echo "--- staging _site ---"
          ls -l _site
          # ยืนยันว่าไฟล์ HTML ไม่ถูกห่อหุ้ม/ทำลายระหว่าง copy
          test -s _site/index.html
          grep -q '<svg id="edges"' _site/index.html

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
